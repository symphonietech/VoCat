# VoCat Docker Compose deployment (test-tool branch).
#
# Quick start — build from this checkout and run:
#   ./scripts/docker-build.sh
#
# That script derives a version from the current git state and runs
# `docker compose up -d --build`. The equivalent by hand:
#   VOCAT_TAG=$(git rev-parse --short HEAD) docker compose up -d --build
#
# Then open http://<host>:7676 and sign in. On a fresh database this branch
# auto-provisions admin/admin123 on first start and logs a warning — change
# that password immediately from Settings on anything reachable beyond your
# own machine. To choose the password up front instead, initialise the
# database before the first `up` (it is read from stdin, never from argv or
# the environment):
#   read -rsp "Admin password: " P; echo
#   printf '%s\n' "$P" | docker compose run --rm -T \
#     --entrypoint /opt/vocat/bin/vocat vocat bootstrap-admin
#   unset P
#
# Updating: in-container binary self-update is intentionally disabled
# (VOCAT_CONTAINER=docker makes the server return 409 on the apply endpoint),
# because a replaced binary would not survive the next recreate. Update by
# rebuilding from a newer checkout:
#   git pull && ./scripts/docker-build.sh
#
# Environment variables this file reads (all optional):
#   VOCAT_TAG         image tag AND the version compiled into the binary
#   VOCAT_BUILD_TIME  build timestamp compiled into the binary
#   VOCAT_PORT        host port to listen on (default 7676)
#   VOCAT_DATA_DIR    host directory holding all server state (default
#                     ./data) — see the volumes section for how to migrate
#                     off the named volume earlier versions of this file used
#   GOPROXY           Go module proxy, for networks that cannot reach
#                     the GCS-backed proxy.golang.org, e.g.
#                     GOPROXY=https://goproxy.cn,direct

services:
  vocat:
    # Tagging the image with VOCAT_TAG keeps each local build distinct, so a
    # later `docker compose pull` cannot silently replace your build under a
    # shared ":latest" tag. Defaults preserve the stock pull-and-run flow.
    image: ghcr.io/mengmengcode/vocat:${VOCAT_TAG:-latest}
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        # Surfaced by `vocat version`, Settings > System Info and
        # GET /api/system/info.
        VERSION: ${VOCAT_TAG:-0.1.0-dev}
        BUILD_TIME: ${VOCAT_BUILD_TIME:-}
    container_name: vocat
    restart: unless-stopped

    # Host network mode: the export-proxy plugin uses SO_BINDTODEVICE to pin
    # outbound proxy traffic to the modem interface (wwan0) so roaming data
    # egresses only the module — never the host's default route. That syscall
    # needs the host network namespace visible inside the container, which
    # network_mode: host provides directly. Port publishing is therefore
    # meaningless — the container shares the host stack and vocat binds
    # VOCAT_ADDR itself — and proxy ports opened by the plugin are likewise
    # reachable on the host IP without explicit mapping.
    network_mode: host

    # Modem/QMI/USB-reader hot-plug uses dynamic character devices. Privileged
    # mode mirrors the documented hardware-access docker run command and also
    # supplies the raw-socket/netlink permissions needed by VoWiFi/IPsec.
    # Combined with host networking this is broad access to the host: run it
    # only on a machine you trust.
    privileged: true
    user: "0:0"

    environment:
      # Marks the process as containerized: the web UI then advertises
      # "pull new image" instead of attempting an in-place binary update.
      VOCAT_CONTAINER: docker
      # Overrides the Dockerfile default so the port can be changed without
      # rebuilding. VOCAT_DATABASE_PATH stays as the Dockerfile sets it,
      # because the volume below and the carrier profile directory are both
      # anchored to it. Admin credentials live only in SQLite.
      VOCAT_ADDR: 0.0.0.0:${VOCAT_PORT:-7676}

    volumes:
      # The entire server state directory, bind-mounted to the host so all of
      # it survives `docker compose down -v`, image rebuilds and container
      # recreates, and so it can be backed up with ordinary file tools. It
      # holds everything the server writes:
      #   vocat.db (+ -wal, -shm)  devices, SMS, users, API tokens, settings
      #   carrier-profiles.d/      carrier profile overrides (see
      #                            docs/carrier-profiles.md)
      #   plugins/                 installed plugins and their own data/
      #   tls/                     self-signed certificate for HTTPS mode
      # Subdirectories are created on demand; an empty or missing host
      # directory is a valid fresh install.
      #
      # Override the host location with VOCAT_DATA_DIR. Use an absolute path
      # on a NAS (QNAP Container Station, Synology) — e.g.
      #   VOCAT_DATA_DIR=/share/Container/vocat/data
      # so bootstrap-admin and the running service cannot end up pointed at
      # different files, which surfaces as "Incorrect password". Keep it on a
      # local filesystem: SQLite's locking is unreliable over NFS/SMB, and on
      # Docker Desktop's file sharing rather than a native Linux filesystem.
      #
      # The container runs as root, so these files are root-owned on the host.
      #
      # MIGRATING from the named volume this file used previously: copy the
      # data out before the first `up`, or the server will find an empty
      # directory and auto-provision a fresh admin/admin123, and your devices
      # and messages will look lost while still sitting in the old volume.
      #   docker compose down
      #   docker volume ls | grep vocat        # confirm the name
      #   mkdir -p ./data
      #   docker run --rm -v vocat_vocat-data:/from -v "$PWD/data":/to \
      #     alpine sh -c 'cd /from && cp -a . /to'
      # Verify ./data contains vocat.db, then `docker compose up -d`. Keep the
      # old volume until you have confirmed the UI shows your data.
      - ${VOCAT_DATA_DIR:-./data}:/opt/vocat/data

      # Required for modem, MHI/WWAN and PC/SC USB-reader discovery, including
      # devices attached after the container starts.
      - /dev:/dev
      - /sys:/sys:ro
