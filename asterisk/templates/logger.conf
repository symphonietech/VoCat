; Rendered by entrypoint.sh -- edit asterisk/templates/logger.conf, not this.
;
; Why this file exists at all: the packaged default declares
;
;   messages => notice,warning,error
;
; which writes /var/log/asterisk/messages.log. That path is not a volume, so
; it lands in the container's writable overlay layer, and nothing in this
; image rotates it -- there is no cron, no logrotate, and Asterisk's own
; rotation only happens when something runs `logger rotate`. The file
; therefore grows for as long as the container runs, inside Docker's own
; filesystem, where it is easy to miss until a disk fills.
;
; A PBX on a public port makes that worse rather than slowly: port 5060 is
; scanned continuously, and every unmatched request is one NOTICE line. A
; host that is reachable from the internet can turn that into hundreds of
; megabytes a day with no calls placed at all.
;
; So the log goes to the console instead. With `asterisk -f` the console IS
; the container's stdout, which means `docker compose logs asterisk` -- and
; that is bounded, by the logging: block in docker-compose.asterisk.yml. Same
; lines, same levels, somewhere with a ceiling.
;
; Set ASTERISK_LOG_TO_FILE=yes in .env to get messages.log back; the
; entrypoint appends it below. Nothing rotates it then either, so treat it as
; a debugging tool to turn off again rather than a place to keep history.

[general]
; ISO-ish and sortable. The default puts the month first as text, which sorts
; alphabetically and so not at all.
dateformat=%F %T

; queue_log is for ACD call queues. This dialplan has none -- it dials SIMs,
; handsets and trunks directly -- so the file would only ever record the
; "queue log started" line at each restart.
queue_log = no

[logfiles]
; Console only, deliberately. See the top of this file before adding a
; second entry here: anything written under /var/log/asterisk in this
; container is unrotated and unbounded.
console => notice,warning,error
