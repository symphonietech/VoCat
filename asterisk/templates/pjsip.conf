; Rendered by entrypoint.sh -- edit asterisk/templates/pjsip.conf, not this.
;
; Two peers: VoCat's trunk, authorised by address, and one softphone account
; authorised by password. That split is the whole design -- identity is
; Asterisk's job, and the trunk has no accounts at all.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Softphones do not all default to UDP, and a client set to TCP gets its
; connection refused by a UDP-only Asterisk -- which looks like a credential
; failure at the phone and produces no log at all here, because nothing ever
; accepted the connection. Listening on both removes that whole class of
; confusion. TCP also avoids UDP fragmentation on large SIP messages.
;
; TLS is deliberately absent: it needs a certificate, and a SIP password
; crossing a LAN in the clear is a decision to make knowingly rather than
; have configured by default. A client set to TLS will fail here.
[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; ---------------------------------------------------------------- VoCat trunk

[vocat]
type=endpoint
context=from-vocat
disallow=all
; VoCat's media layer is G.711 only, which is what its carriers negotiate.
allow=ulaw
allow=alaw
; The trunk bridges audio itself, so Asterisk must stay in the media path.
direct_media=no
; VoCat has no registrar and nothing to authenticate against.
aors=vocat
; Pinned, not left to PJSIP. VoCat's trunk is a UDP listener and nothing
; else, so an INVITE sent over TCP would go unanswered. That was unambiguous
; while UDP was the only transport configured here; adding TCP for softphones
; made it a choice, and this is the side of it that works.
transport=transport-udp
; rtp_symmetric/rewrite_contact are deliberately off: both sides of this leg
; are on the same host, so there is no NAT to work around and turning them on
; would only hide a real addressing mistake.

[vocat]
type=aor
contact=sip:vocat@$VOCAT_TRUNK_HOST
; Without this the contact reads NonQual for ever and `pjsip show endpoint
; vocat` can never say Avail -- Asterisk only learns a peer is reachable by
; sending it OPTIONS. VoCat answers those, and logs them at debug so a
; keepalive every minute does not bury real call activity.
qualify_frequency=60

[vocat]
type=identify
endpoint=vocat
; VoCat's trunk sends from whatever address it binds; on host networking that
; is the same loopback the contact points at.
match=127.0.0.1

; ------------------------------------------------------------------ softphone

[$ASTERISK_SIP_USER]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=$ASTERISK_SIP_USER
aors=$ASTERISK_SIP_USER
; A softphone on a phone network is behind NAT essentially always.
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no

[$ASTERISK_SIP_USER]
type=auth
auth_type=userpass
username=$ASTERISK_SIP_USER
password=$ASTERISK_SIP_PASSWORD

[$ASTERISK_SIP_USER]
type=aor
; Two contacts lets the same account register from a phone and a desktop at
; once; Asterisk rings both and the first to answer wins.
max_contacts=2
remove_existing=yes
qualify_frequency=60
