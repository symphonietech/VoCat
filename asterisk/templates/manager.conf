; Rendered by entrypoint.sh -- edit asterisk/templates/manager.conf.
;
; The manager interface is how VoCat reads live PBX state (which softphones
; are registered, whether the trunk is reachable) without a shell in this
; container or a Docker socket in VoCat's.
;
; Loopback only. AMI is a privileged interface and its password crosses a
; plain connection in the clear; both containers share the host network
; namespace, so 127.0.0.1 reaches VoCat and nothing else.

[general]
enabled = $ASTERISK_AMI_ENABLED
port = 5038
bindaddr = 127.0.0.1
; No unsolicited events: VoCat sends actions and reads their replies.
displayconnects = no
timestampevents = no

[$ASTERISK_AMI_USER]
secret = $ASTERISK_AMI_SECRET
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
; system covers reloads; reporting covers the PJSIP listings. "command" is
; deliberately absent: it runs arbitrary CLI inside this container, which is
; shell-equivalent, and the Reload action does what VoCat needs without it.
read = system,reporting
write = system,reporting
