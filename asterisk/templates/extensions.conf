; Rendered by entrypoint.sh -- edit asterisk/templates/extensions.conf.

[general]
static=yes
writeprotect=yes

[globals]

; Routes live in a file VoCat generates, in the directory both containers
; share. The entrypoint writes a default one on first start, so this include
; always resolves even before anything is configured in the web UI.
#include "vocat/routes.conf"

; Extension-to-extension dialling, generated from the same account list as
; the PJSIP endpoints so an account cannot exist without being dialable.
#include "vocat/internal.conf"

; Where a call arriving on a SIM rings. Generated too, from the inbound mode
; chosen in the web UI.
#include "vocat/inbound.conf"

; One context per external SIP trunk, generated from the trunk list in the web
; UI and seeded empty by the entrypoint so this include always resolves. The
; contexts share no includes with each other or with from-internal.
#include "vocat/trunk-routes.conf"

; SMS in both directions: where a text from a SIM is delivered, and one
; context per extension naming that extension as the sender of anything it
; sends. Generated, and seeded empty by the entrypoint so this resolves.
#include "vocat/messages.conf"

[from-internal]
; Nothing but includes. A pattern here would win over them: Asterisk picks
; the best match within a context and only walks includes when the context
; itself matches nothing, so a local _. would make the generated routes
; unreachable.
;
; Internal first, and the order matters. Across includes Asterisk takes the
; first one that matches rather than the best match among them all, so an
; exact extension here wins over a route pattern -- which is what makes
; dialling 1002 ring a handset instead of being sent to a SIM.
include => vocat-internal
include => vocat-routes

[vocat-predial]
; X-VoCat-Device names which SIM places the call. It has to be added here, in
; a b() pre-dial handler, because that runs on the *outbound* channel: calling
; PJSIP_HEADER(add) in [from-internal] would attach the header to the
; softphone's own leg, where VoCat never sees it.
;
; VOCATDEV is inherited from the dialling channel (the __ prefix is what makes
; it inherit). VoCat picks the SIM itself when only one is IMS-registered, so
; an empty value adds no header at all rather than an empty one.
exten => s,1,ExecIf($["${VOCATDEV}" != ""]?Set(PJSIP_HEADER(add,X-VoCat-Device)=${VOCATDEV}))
 same => n,Return()

[from-vocat]
; Inbound from a SIM. VoCat puts the dialled number -- the SIM's own -- in the
; request URI, and [vocat-inbound] decides what that rings: the extension
; named after it, every extension at once, or a list in order.
;
; Nothing but the include, for the same reason [from-internal] has none: a
; pattern here would win over it, because Asterisk only walks includes when
; the context itself matches nothing.
include => vocat-inbound
