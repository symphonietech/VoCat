; Rendered by entrypoint.sh -- edit asterisk/templates/extensions.conf.

[general]
static=yes
writeprotect=yes

[globals]

[from-internal]
; Everything dialled goes out through the SIM, so the pattern is "everything".
;
; Asterisk logs a warning that _. matches any extension. Here that is the
; point, not a mistake: this context has no feature codes, no voicemail and
; no local extensions -- one trunk, one destination. VoCat validates the
; number and rejects what it cannot dial.
;
; It replaces three patterns that tried to enumerate leading characters
; (_X. / _+X. / _*X.). A softphone sending +E.164 was answered 404 by
; Asterisk before the INVITE ever reached VoCat: a bare + in a pattern is
; unreliable, and the reports on whether [+] fixes it disagree. Matching
; everything sidesteps the question rather than betting on an answer.
;
; The number is passed through untouched. Stripping a leading + here would
; break carriers that want E.164.
exten => _.,1,Set(__VOCATDEV=$VOCAT_DEVICE)
 same => n,Dial(PJSIP/${EXTEN}@vocat,60,b(vocat-predial^s^1))
 same => n,Hangup()

[vocat-predial]
; X-VoCat-Device names which SIM places the call. It has to be added here, in
; a b() pre-dial handler, because that runs on the *outbound* channel: calling
; PJSIP_HEADER(add) in [from-internal] would attach the header to the
; softphone's own leg, where VoCat never sees it.
;
; VOCATDEV is inherited from the dialling channel (the __ prefix is what makes
; it inherit). VoCat picks the SIM itself when only one is IMS-registered, so
; an empty value adds no header at all rather than an empty one.
exten => s,1,ExecIf($["${VOCATDEV}" != ""]?Set(PJSIP_HEADER(add,X-VoCat-Device)=${VOCATDEV}))
 same => n,Return()

[from-vocat]
; Inbound from the SIM rings the softphone. VoCat does not offer inbound calls
; to the trunk yet, so nothing reaches this context; it is here so the
; endpoint has a context to name, and so the direction is ready when it lands.
exten => _.,1,Dial(PJSIP/$ASTERISK_SIP_USER,30)
 same => n,Hangup()
exten => s,1,Dial(PJSIP/$ASTERISK_SIP_USER,30)
 same => n,Hangup()
