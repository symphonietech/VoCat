[general]
; Narrower than the 10000-20000 default. Two hundred ports is a hundred
; concurrent calls, far more than a SIM gateway will ever carry, and it keeps
; the range small enough to publish explicitly if this ever moves off host
; networking.
rtpstart=10000
rtpend=10200
