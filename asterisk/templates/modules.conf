; Rendered by entrypoint.sh -- edit asterisk/templates/modules.conf.

[modules]
autoload=yes

; chan_sip is the pre-PJSIP channel driver, removed upstream in Asterisk 21.
; On the Asterisk 22 this image now builds on there is nothing to unload and
; this line is a harmless no-op -- Asterisk ignores a noload for a module it
; does not have. It stays because it costs nothing and because it is exactly
; what a rebase onto an older base (24.04 / Asterisk 20) would need:
;
; Asterisk 20 still shipped chan_sip, and the packaged sip.conf had it bind
; 5060 -- the same port pjsip.conf wants. Whichever driver loads first takes
; the port, and when chan_sip wins, every REGISTER is answered by a driver
; that has never heard of the endpoints defined in pjsip.conf.
;
; That failure is nastier than it sounds: chan_sip's alwaysauthreject default
; answers an unknown peer with a challenge and then "Wrong password", instead
; of saying the peer does not exist -- deliberate, so a scanner cannot
; enumerate valid extensions, but it sends anyone debugging their own setup
; hunting a credential problem that is not there.
;
; This trunk is PJSIP-only, so the old driver is simply not loaded.
noload => chan_sip.so
