# Asterisk in front of VoCat's SIP trunk.
#
# This is an overlay, not a replacement -- Compose needs both files, every
# time. Set COMPOSE_FILE in .env and it picks up both with no -f flags:
#
#   cp .env.example .env && ${EDITOR:-nano} .env
#     ASTERISK_SIP_PASSWORD=...
#     COMPOSE_FILE=docker-compose.yml:docker-compose.asterisk.yml
#   ./scripts/docker-build.sh
#
# docker-build.sh builds BOTH services and derives VOCAT_TAG from git, which
# is also the version compiled into the VoCat binary. A bare
# `docker compose up -d --build` builds both too, but tags the image :latest
# and reports 0.1.0-dev in Settings > System Info.
#
# Editing a config template needs no rebuild -- they are bind-mounted and
# rendered at every start, so `docker compose restart asterisk` is enough.
#
# Then point a softphone (Linphone, Zoiper, a desk phone) at this host:
#   server    <this host's LAN IP>
#   username  1001          (ASTERISK_SIP_USER)
#   password  <ASTERISK_SIP_PASSWORD>
#   transport UDP
#
# Dial any number and the call goes out over the SIM's IMS registration.
#
# WHY HOST NETWORKING. VoCat already runs with network_mode: host, so its
# trunk on 127.0.0.1:5062 is the *host's* loopback -- a bridged container
# cannot reach it. Putting Asterisk on host networking too means both sides
# talk over loopback with no NAT anywhere, and the RTP range needs no port
# publishing. The cost is that Asterisk binds the host's port 5060 directly:
# if something already has it, see the bridged alternative in
# docs/sip-trunk.md.

services:
  vocat:
    environment:
      # Enables the trunk. Loopback only: authorisation here is by source
      # address, so the listener must not be reachable from anywhere the
      # operator has not chosen deliberately.
      VOCAT_SIP_TRUNK_ADDR: 127.0.0.1:5062
      VOCAT_SIP_TRUNK_PEERS: 127.0.0.1
      # The other direction: VoCat reading Asterisk's live state. Loopback
      # only -- both containers share the host network namespace, and an AMI
      # password crosses a plain connection in the clear.
      VOCAT_ASTERISK_AMI_ADDR: ${ASTERISK_AMI_SECRET:+127.0.0.1:5038}
      VOCAT_ASTERISK_AMI_USER: ${ASTERISK_AMI_USER:-vocat}
      VOCAT_ASTERISK_AMI_SECRET: ${ASTERISK_AMI_SECRET:-}

  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    image: vocat-asterisk:${VOCAT_TAG:-latest}
    container_name: vocat-asterisk
    restart: unless-stopped
    depends_on:
      - vocat
    network_mode: host

    environment:
      # Required. The entrypoint refuses to start without it, and refuses one
      # shorter than 12 characters: SIP registrars are scanned continuously,
      # and a weak one on a PBX with a SIM behind it becomes someone else's
      # long-distance plan.
      ASTERISK_SIP_PASSWORD: ${ASTERISK_SIP_PASSWORD:?set ASTERISK_SIP_PASSWORD in .env}
      ASTERISK_SIP_USER: ${ASTERISK_SIP_USER:-1001}
      VOCAT_TRUNK_HOST: ${VOCAT_TRUNK_HOST:-127.0.0.1:5062}
      # Which SIM places outbound calls. Leave empty while one device is
      # IMS-registered; name one (device ID or name) once a second is.
      VOCAT_DEVICE: ${VOCAT_DEVICE:-}
      # Manager interface, which VoCat reads live PBX status from. Empty
      # leaves AMI disabled entirely rather than exposing an account nothing
      # uses.
      ASTERISK_AMI_USER: ${ASTERISK_AMI_USER:-vocat}
      ASTERISK_AMI_SECRET: ${ASTERISK_AMI_SECRET:-}

    volumes:
      # Rendered into /etc/asterisk at start, on top of the package defaults.
      - ./asterisk/templates:/etc/asterisk/templates:ro
      # Voicemail and recordings, which should survive a recreate.
      - asterisk-spool:/var/spool/asterisk

volumes:
  asterisk-spool:
